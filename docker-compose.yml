# تشغيل تجريبي محلي (اختياري):
#   docker compose up --build
# ثم افتح http://localhost:8000
services:
  tv:
    build: .
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      CHANNEL_NAME: "قناتي HD"
      # RESTREAM_URL: "https://example.com/live/master.m3u8"
      # RESTREAM_TYPE: "auto"   # auto | hls | ts
    restart: unless-stopped
